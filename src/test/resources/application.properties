# Configuração usada SOMENTE nos testes. Não depende do application.properties
# local (que é ignorado pelo git) e não precisa de Docker, Postgres nem Ollama.
spring.application.name=tc-corporate-rag-test

spring.datasource.url=jdbc:postgresql://localhost:5432/tc_rag_test
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.postgresql.Driver

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.2:latest
spring.ai.ollama.embedding.model=nomic-embed-text

spring.ai.vectorstore.pgvector.initialize-schema=false
# Nos testes nenhum banco vetorial real e criado: o autoconfigure do pgvector e o do Chroma
# ficam excluidos e o PgVectorStore e substituido por mock (@MockitoBean).
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration,org.springframework.ai.vectorstore.chroma.autoconfigure.ChromaVectorStoreAutoConfiguration

spring.docker.compose.enabled=false
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
