# Perfil da rodada com o modelo multilingue bge-m3 (1024 dimensoes, sem prefixos de tarefa).
# Ativar com: mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=bge-m3"
# As demais propriedades vem do application.properties local.
#
# O perfil usa uma tabela do pgvector e uma colecao do ChromaDB proprias, porque a dimensao do
# vetor e fixa (768 no nomic-embed-text, 1024 no bge-m3). Assim os vetores do nomic-embed-text
# ficam intactos e e possivel voltar a eles sem reindexar.

spring.ai.ollama.embedding.model=bge-m3
spring.ai.ollama.embedding.options.model=bge-m3

spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.table-name=vector_store_bge_m3
spring.ai.vectorstore.chroma.collection-name=tc_corporate_rag_bge_m3

# O bge-m3 nao usa os prefixos search_document:/search_query: do nomic-embed-text.
rag.embedding.prefixos=false
