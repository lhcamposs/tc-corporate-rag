services:

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Descomente o bloco abaixo se sua máquina tiver GPU NVIDIA com nvidia-container-toolkit instalado
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-pull-models:
    image: curlimages/curl:latest
    container_name: ollama-pull-models
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        sleep 5;
        curl -X POST http://ollama:11434/api/pull -d '{"name": "llama3.2:3b"}';
        curl -X POST http://ollama:11434/api/pull -d '{"name": "nomic-embed-text"}';

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: lhcampos
      POSTGRES_PASSWORD: 135791
      POSTGRES_DB: tc_rag_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lhcampos -d tc_rag_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    # Ative este serviço quando entrar na Fase 4 (comparação pgvector x ChromaDB).
    # Pode comentar o serviço inteiro enquanto o foco é só o pipeline com pgvector.

volumes:
  ollama_data:
  postgres_data:
  chroma_data:
